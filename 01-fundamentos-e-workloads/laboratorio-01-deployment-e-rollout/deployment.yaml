apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: laboratorio-rollout
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: laboratorio-rollout
spec:
  replicas: 3
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          env:
            - name: MENSAGEM_RELEASE
              value: "v1"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
